name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Unit Tests
        run: |
          npm run typecheck
          npm test

      - name: Decode Android Keystore
        env:
          KEYSTORE_B64: ${{ secrets.PACE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pace-upload.jks"

      - name: Run Expo Prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build Signed Release APK
        working-directory: android
        env:
          PACE_UPLOAD_STORE_FILE: ${{ runner.temp }}/pace-upload.jks
          PACE_UPLOAD_KEY_ALIAS: ${{ secrets.PACE_UPLOAD_KEY_ALIAS }}
          PACE_UPLOAD_STORE_PASSWORD: ${{ secrets.PACE_UPLOAD_STORE_PASSWORD }}
          PACE_UPLOAD_KEY_PASSWORD: ${{ secrets.PACE_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK output
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Pace-${VERSION}.apk"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pace-${{ env.APP_VERSION }}-apk
          path: Pace-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30
